  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht 2\": \"DL 2169 (Boeing 737-800): SEA 4:50 PM → JNU 6:26 PM, seats 15A/15B\",\n        \"Date\": \"Sun, Aug 9, 2026\",\n        \"Class\": \"Delta Comfort+ (SW fare class)\",\n        \"eTicket — Ken\": \"0062431436335\",\n        \"eTicket — Georgianna\": \"0062431436336\",\n        \"Booking link\": \"https://www.delta.com/my-trips\"\n      },\n      \"notes\": \"Tight 50-min connection at SEA but same airline, same terminal. Gold Medallion Sky Priority screening helps.\"\n    },\n    {\n      \"name\": \"JNU → ANC (Intra-Alaska)\",\n      \"subtitle\": \"Alaska Airlines 1539 — First Class, nonstop\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Flight\": \"Alaska 1539 (nonstop, 568 mi, ~1h 46m)\",\n        \"Date\": \"Thu, Aug 13, 2026\",\n        \"Depart\": \"JNU 7:15 PM\",\n        \"Arrive\": \"ANC 9:01 PM\",\n        \"Class\": \"First Class (D)\",\n        \"Seats\": \"2D (Ken) / 2F (Georgianna)\",\n        \"Confirmation #\": \"GFXHIT\",\n        \"Check-in\": \"Alaska Airlines (alaskaair.com)\",\n        \"Booking link\": \"https://www.alaskaair.com/\"\n      },\n      \"notes\": \"Not a Delta partnership — no SkyMiles earned, but Alaska Mileage Plan miles available if you create an account. Sheraton Anchorage check-in around 9:45 PM.\"\n    },\n    {\n      \"name\": \"ANC → ATL (Return)\",\n      \"subtitle\": \"Delta One Classic — overnight nonstop, lie-flat\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Flight\": \"DL 0416 (Boeing 767-300)\",\n        \"Depart\": \"Wed, Aug 19 at 8:24 PM (ANC South Terminal)\",\n        \"Arrive\": \"Thu, Aug 20 at 7:14 AM (ATL Domestic Term-South)\",\n        \"Duration\": \"6h 50m nonstop\",\n        \"Class\": \"Delta One Classic (Z fare class)\",\n        \"Seats\": \"5C (Ken) / 5B (Georgianna) — paired lie-flat\",\n        \"eTicket — Ken\": \"0062431535234\",\n        \"eTicket — Georgianna\": \"0062431535235\",\n        \"Perks\": \"Sky Club ANC + ATL, Zone 1 boarding, lounge dining\",\n        \"Booking link\": \"https://www.delta.com/my-trips\"\n      },\n      \"notes\": \"Overnight red-eye after the trip — lie-flat seats let you sleep across the country. Plenty of time on Aug 19 in Anchorage before the 8:24 PM departure.\"\n    }\n  ],\n  \"hotels\": [\n    {\n      \"name\": \"Four Points by Sheraton Juneau\",\n      \"subtitle\": \"Marriott Bonvoy • 51 Egan Drive, Juneau\",\n      \"status\": \"confirmed\",\n      \"priority\": \"ACTION: Reservation shows 1 Adult — call 800-228-9290 or update in Bonvoy app to add Georgianna\",\n      \"fields\": {\n        \"Confirmation #\": \"70293902\",\n        \"Check-in\": \"Sun, Aug 9, 2026\",\n        \"Check-out\": \"Fri, Aug 14, 2026 (5 nights — Bonvoy 5th-night-free)\",\n        \"Room\": \"Guest Room • 1 King • Mountain View\",\n        \"Cost\": \"Bonvoy points (5th night free benefit applied)\",\n        \"Cancel by\": \"Fri Aug 7, 2026 at 11:59 PM local (2 days before)\",\n        \"Phone\": \"907-586-6900\",\n        \"Booking link\": \"https://www.marriott.com/en-us/hotels/jnufp-four-points-juneau/\"\n      },\n      \"notes\": \"Actual stay is 4 nights (Aug 9-13). The 5th night (Aug 13-14) is functionally a late-checkout/flight-delay buffer — Alaska 1539 doesn't leave JNU until 7:15 PM Aug 13. Standard checkout 11 AM, but with the booked night you can use the room all day Aug 13. Downtown waterfront. South-facing = harbor view (you've got mountain view).\"\n    },\n    {\n      \"name\": \"Anchorage Marriott Downtown (1st stay)\",\n      \"subtitle\": \"Marriott Bonvoy • Tallest hotel in Anchorage\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Confirmation #\": \"71989845\",\n        \"Check-in\": \"Thu, Aug 13, 2026\",\n        \"Check-out\": \"Fri, Aug 14, 2026 (1 night)\",\n        \"Cost\": \"65,000 Bonvoy points (plus $325 to buy needed points)\",\n        \"Address\": \"820 W 7th Ave, Anchorage\",\n        \"Phone\": \"907-279-8000\",\n        \"Booking link\": \"https://www.marriott.com/hotels/travel/ancdt-marriott-anchorage-downtown\"\n      },\n      \"notes\": \"Layover night before the GoldStar train Aug 14. Train depot is ~1 mile from hotel. Platinum Elite status applies — free breakfast or F&B credit, possible room upgrade. Request a high floor with west-facing Cook Inlet view.\"\n    },\n    {\n      \"name\": \"Denali Bluffs Hotel\",\n      \"subtitle\": \"Same operator as Grande Denali, base of the hill • Parks Hwy, Denali NP\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Confirmation #\": \"HAS87JEDY\",\n        \"Check-in\": \"Fri, Aug 14, 2026 (4:00 PM)\",\n        \"Check-out\": \"Mon, Aug 17, 2026 (10:00 AM) — 3 nights\",\n        \"Room\": \"1 Queen & 1 Double Bed\",\n        \"Rate\": \"$629.59/night (incl. tax)\",\n        \"NPR service fee\": \"$188.88 (non-refundable, already charged)\",\n        \"Total paid\": \"$2,077.65\",\n        \"Front desk\": \"24 hours\",\n        \"Address\": \"P.O. Box 8 / 238 George Parks Hwy, Denali NP, AK 99755\",\n        \"Cancel/change\": \"1-866-875-8456 option 2\",\n        \"Booking link\": \"https://www.denalialaska.com/denali-bluffs-hotel/\"\n      },\n      \"notes\": \"NPR switched from Grande Denali (no availability) to sister property Denali Bluffs — same operator, same area, slightly cheaper. Free shuttle from the train depot to the hotel — look for the Denali Bluffs/Grande Denali shuttle when you arrive Aug 14 ~3:40 PM. NOT a Bonvoy property. RAIL TRANSFER BOOKED by phone Aug 10, 2026 — $12/person + $12/luggage, round trip, no email confirmation received. RECONFIRM AT CHECK-IN Aug 14, and get the Monday Aug 17 hotel pickup time in writing: the train south departs Denali at 12:30 PM, so the shuttle needs to leave the Bluffs well before that.\"\n    },\n    {\n      \"name\": \"Hotel Captain Cook (2nd Anchorage stay)\",\n      \"subtitle\": \"Iconic independent luxury hotel • Junior Suite • Downtown\",\n      \"status\": \"confirmed\",\n      \"priority\": \"Verify reservation with hotel direct (907-931-4421) a few days before — third-party booking, confirm Junior Suite room type\",\n      \"fields\": {\n        \"Booking #\": \"9092917186777 (via HotelsOne)\",\n        \"Check-in\": \"Mon, Aug 17, 2026 (from 4:00 PM)\",\n        \"Check-out\": \"Wed, Aug 19, 2026 (by 11:00 AM)\",\n        \"Room\": \"Junior Suite\",\n        \"Total paid\": \"$1,637.46 (prepaid, likely non-refundable)\",\n        \"Address\": \"939 W 5th Ave, Anchorage\",\n        \"Hotel direct\": \"907-931-4421\",\n        \"HotelsOne service\": \"855-213-5609 (for changes/cancellation)\",\n        \"Booking link\": \"https://www.captaincook.com/\"\n      },\n      \"notes\": \"ON-SITE: Crow's Nest fine dining (top floor, panoramic views — Aug 18 dinner planned, 8:30 PM last seating; reserve at 907-343-2217; closed Sun-Mon; business casual), Whale's Tail lounge, Pantry casual, Fletcher's Irish pub. REQUEST AT CHECK-IN: late checkout for Aug 19 (DL 0416 leaves at 8:24 PM, so 2-4 PM checkout is ideal). No chain loyalty status applies — independent hotel.\"\n    }\n  ],\n  \"activities\": [\n    {\n      \"name\": \"Juneau Rental Car — 2023 Volvo XC60\",\n      \"subtitle\": \"Turo • AWD, unlimited miles • picked up at JNU\",\n      \"status\": \"confirmed\",\n      \"priority\": \"ACTION: Save the host's name, phone, and exact pickup instructions from the Turo app before you fly — you land at 6:26 PM and this is a person, not a counter\",\n      \"fields\": {\n        \"Reservation #\": \"59885242\",\n        \"Vehicle\": \"2023 Volvo XC60 — AWD, 2-row, unlimited miles\",\n        \"Platform\": \"Turo (peer-to-peer — no rental counter)\",\n        \"Host rating\": \"All-Star Host • 5.0 (45 trips)\",\n        \"Pickup\": \"On-site at JNU — Sun, Aug 9, 2026, after DL 2169 lands 6:26 PM\",\n        \"Return\": \"JNU — Thu, Aug 13, 2026, before Alaska 1539 departs 7:15 PM\",\n        \"Cost (paid)\": \"$921.47 total (incl. Turo fees + taxes)\",\n        \"Booking link\": \"https://turo.com/us/en/trips\"\n      },\n      \"notes\": \"WHY: the Aug 10 whale tour (7:30 AM) and Aug 11 bear tour (1:30 PM — operator moved it from 7:30 AM) are both at Auke Bay (~10 miles NW of the hotel) and both are self-transport — no shuttle from downtown. Leave the Four Points by ~6:45 AM on Aug 10 and ~12:45 PM on Aug 11. PARKING: Statter Harbor requires a parking pass on Aug 10 — buy from the kiosk on arrival. Juneau's road system is ~45 miles, all paved — AWD is for rain, not terrain. IF DELTA IS LATE: the 50-min SEA connection is the weak link; message the host from SEA if DL 2169 slips so pickup doesn't go unanswered.\"\n    },\n    {\n      \"name\": \"Anchorage/Seward Rental Car — 2023 Toyota 4Runner\",\n      \"subtitle\": \"Turo • delivered to the Captain Cook • Aug 17-19\",\n      \"status\": \"confirmed\",\n      \"priority\": \"ACTION: Confirm two things with the host BEFORE arrival — (1) airport return at ANC on Aug 19 is allowed, and (2) contactless/lockbox handoff on Aug 17 so a late train doesn't strand the pickup\",\n      \"fields\": {\n        \"Reservation #\": \"59887513\",\n        \"Vehicle\": \"2023 Toyota 4Runner\",\n        \"Platform\": \"Turo (peer-to-peer — delivered, no counter)\",\n        \"Host rating\": \"All-Star Host • 4.98 (116 trips)\",\n        \"Pickup\": \"Mon, Aug 17, 2026 — late evening, delivered to Hotel Captain Cook, 939 W 5th Ave\",\n        \"Return\": \"Wed, Aug 19, 2026 — ~6:00 PM at ANC (South Terminal), ahead of DL 0416 at 8:24 PM\",\n        \"Mileage\": \"400 miles included • $0.95/mile over\",\n        \"Planned mileage\": \"~290 miles (Seward round trip ~255 + Anchorage local/airport ~35) — ~110 miles of headroom\",\n        \"Cost (paid)\": \"$535.19 total\",\n        \"Booking link\": \"https://turo.com/us/en/trips\"\n      },\n      \"notes\": \"WHY 2 DAYS, NOT 1: the Aug 18 cruise needs a 7:30 AM departure from downtown to make the 10:30 AM Seward check-in, and Anchorage counters don't open early enough for a same-morning pickup. Having the car the night before removes that risk. RETURN AT THE AIRPORT, not the hotel — that's the point of keeping it through Aug 19, so you're not moving luggage into a cab on departure day. MILEAGE WATCH: the 400-mile cap is comfortable for the plan as written, but a Girdwood (~80 mi round trip) or Portage Glacier (~100 mi) run on Aug 19 would put you at 370-390 and close to the overage. PARKING: you'll owe Captain Cook parking for the nights of Aug 17 and Aug 18 — confirm the rate and whether the garage is valet-only (valet-only slows a 7:15 AM start). LUGGAGE: if you don't get the late checkout, leave bags with the bell desk for the day rather than in the parked car.\"\n    },\n    {\n      \"name\": \"Harv's Original 6-Passenger Whale Watch\",\n      \"subtitle\": \"Harv & Marv's / Alaska Galore Tours • Auke Bay\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Date\": \"Mon, Aug 10, 2026 • 7:30 AM – 11:30 AM (4 hrs)\",\n        \"Operator\": \"Harv & Marv's Outback Alaska\",\n        \"Confirmation #\": \"351420672\",\n        \"Cost (paid)\": \"$375.90 (was $441.00; $65.10 refunded)\",\n        \"Meet at\": \"Statter Harbor, 11520 Auke Bay Harbor Rd, Juneau\",\n        \"Exact spot\": \"Top of gangway in front of gray building w/ whale tail replica, under covered area\",\n        \"Parking\": \"Statter Harbor requires a parking pass — buy from kiosk on arrival\",\n        \"Dispatch phone\": \"907-209-8686 (call if you can't find crew)\",\n        \"Change/cancel\": \"877-794-2537\",\n        \"Booking link\": \"https://www.harvandmarvs-juneau-whale-watching.com/\"\n      },\n      \"notes\": \"SAILED ON THE 18-PASSENGER BOAT: operator switched us on the morning of Aug 10 and refunded the $65.10 price difference without being asked. Net paid $375.90. INCLUDED: light snacks, water, sodas. You can pack your own snack/lunch if you want. Be at the meeting point 15 min early. Self-transport (no shuttle from downtown). Same general area as the Waterfall Creek floatplane base — Auke Bay is ~10 miles NW of downtown Juneau. CANCEL: 30+ days out (by Jul 11) = full refund minus $50. 15-29 days = 50% refund. Inside 14 days = no refund (except weather/illness).\"\n    },\n    {\n      \"name\": \"Waterfall Creek Brown Bear Viewing\",\n      \"subtitle\": \"Chichagof Island • 30-min floatplane from Juneau\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Date\": \"Tue, Aug 11, 2026 • 1:30 PM – 7:30 PM (6 hrs)\",\n        \"Operator\": \"Above & Beyond Alaska\",\n        \"Confirmation #\": \"351418378\",\n        \"Cost (paid)\": \"$2,096.68\",\n        \"Pickup\": \"Pavitts Health & Fitness Auke Bay — 10004 Glacier Hwy, Juneau (park in back of lot, be ready at 1:30 PM)\",\n        \"Office\": \"490 S Franklin St, Juneau\",\n        \"Weight limit\": \"250 lbs per person (floatplane restriction)\",\n        \"Min group\": \"4 guests required — could be cancelled if not met\",\n        \"Cancellation\": \"Full refund if cancelled 72+ hrs before; $50/pax deposit non-refundable\",\n        \"Booking link\": \"https://fareharbor.com/embeds/book/beyondak/items/364460/calendar/2026/08/\"\n      },\n      \"notes\": \"RESCHEDULED by Above & Beyond Alaska: now 1:30 PM – ~7:30 PM (was 7:30 AM – 1:30 PM). CONFIRM IN WRITING: same Auke Bay pickup point, whether 1:30 PM is pickup or wheels-up, and whether the 4-guest minimum is now met. NOTE: only snacks are included and this slot spans dinner — eat a real lunch beforehand and plan a late dinner (~8:15 PM downtown). INCLUDED: pro guide, van + floatplane transport, Forest Service permits, rain gear (jacket/boots/pants), snacks, water bottle. BRING: polyester/synthetic layers, sunglasses, warm hat & gloves, thick socks, camera/binoculars, cash for guide gratuity. ON SITE: no dock, no bathrooms, no shelter, no cell service — go before you board. Operates in all weather barring safety issues. Sample itinerary: 1 hr van → 30 min floatplane → 3 hrs bears → 30 min floatplane → 1 hr van back.\"\n    },\n    {\n      \"name\": \"Dog Sledding on Mendenhall Glacier\",\n      \"subtitle\": \"TEMSCO Helicopters • Juneau Icefield dog camp\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Confirmation #\": \"351540985\",\n        \"Date\": \"Wed, Aug 12, 2026 • 2:45 PM – 5:30 PM (2h 45m)\",\n        \"Cost (paid)\": \"$1,481.88 ($740.94/pax)\",\n        \"Pickup\": \"Four Points by Sheraton lobby — be in lobby/outside by 2:30 PM (15 min prior to 2:45 pickup). Look for TEMSCO vehicle.\",\n        \"Pickup address\": \"51 Egan Dr, Juneau\",\n        \"TEMSCO phone\": \"907-789-9501\",\n        \"Email\": \"info@temscoair.com\",\n        \"Booking link\": \"https://temscoair.com/juneau-helicopter-tours/dog-sled/\"\n      },\n      \"notes\": \"WEAR: warm layers, hat, gloves, sunglasses, raincoat, regular walking shoes (glacier boots provided over your shoes). Glacier is 10°F+ cooler than town. PROHIBITED: bags/purses/backpacks (lockers provided), selfie sticks, GoPro sticks, iPads/tablets, drones. Cameras OK. WEIGHT SURCHARGE: $150 added at booking for any pax 250 lbs+ (incl. shoes/clothing). ACTIVITY: moderate — 18\\\" step in/out of helicopter, 100 ft walk to camp. If TEMSCO cancels for weather, full refund.\"\n    },\n    {\n      \"name\": \"Alaska Railroad GoldStar — ANC → Denali\",\n      \"subtitle\": \"Denali Star • glass-domed cars\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Date\": \"Fri, Aug 14, 2026\",\n        \"Depart\": \"ANC 8:20 AM\",\n        \"Arrive\": \"Denali 3:40 PM\",\n        \"Operator\": \"Alaska Railroad\",\n        \"Confirmation #\": \"WRR788421\",\n        \"Cost (paid)\": \"$1,598.00 round-trip both legs (this same conf covers Aug 17 return)\",\n        \"Check-in\": \"1 hour prior to departure (7:20 AM)\",\n        \"Change/cancel\": \"800-544-0552 or reservations@ak \"Cost (paid)\": \"$289.50 (incl. $15/pax NPS entrance fee)\",\n        \"Operator\": \"Doyon/ARAMARK Joint Venture\",\n        \"Phone\": \"800-622-7275\",\n        \"Booking link\": \"https://www.reservedenali.com/\"\n      },\n      \"notes\": \"2 DAYS BEFORE TOUR (Aug 13): visit ReserveDenali.com → 'Retrieve Reservations' to confirm exact departure time and loading location. Park road open to Mile 43 only in 2026 (Pretty Rocks landslide). Expect bears, moose, caribou, Dall sheep, possibly wolves. No smoking/alcohol on the bus.\"\n    },\n    {\n      \"name\": \"Kenai Fjords NP Cruise (Major Marine Tours)\",\n      \"subtitle\": \"Seward — 6-hr ranger-narrated cruise + deli lunch\",\n      \"status\": \"confirmed\",\n      \"fields\": {\n        \"Date\": \"Tue, Aug 18, 2026\",\n        \"Tour\": \"Cruise With Deli Lunch — 6-hr Kenai Fjords National Park Cruise (ranger narrated)\",\n        \"Operator\": \"Major Marine Tours\",\n        \"Check-in\": \"10:30 AM — Seward Check-In Office in the Harbor 360 Hotel\",\n        \"Departs / Returns\": \"Departs 11:30 AM • Returns 5:30 PM\",\n        \"Office address\": \"1412 4th Avenue, Seward, AK 99664\",\n        \"Phone\": \"(907) 224-8030\",\n        \"Party\": \"2 adults • Deli lunch: roast beef sandwich ×2 (included)\",\n        \"Cost (paid)\": \"$497.00 — $478 fares + $10 dock fee + $9 park fuel surcharge\",\n        \"Special assistance\": \"None needed\",\n        \"Booking link\": \"https://majormarine.com/\"\n      },\n      \"notes\": \"Wildlife on this route: humpback whales, orcas, sea lions, sea otters, puffins (horned & tufted), dall's porpoises. Tidewater glaciers — Holgate Glacier calving up close. This is the marine glacier + fjord experience you haven't had elsewhere on the trip. Long day (12+ hrs) but Aug 17 train day = built-in rest day before. Drive ~3 hrs from Anchorage via the Seward Highway — leave by ~7:30 AM to make the 10:30 AM check-in.\"\n    },\n    {\n      \"name\": \"Denali Flightsee ellable up to 1 day before travel for 90% refund.\"\n    }\n  ],\n  \"itinerary\": [\n    { \"date\": \"2026-08-09\", \"plan\": \"<strong>Fly ATL → SEA → JNU.<\u002Fstrong> DL 2169 lands 6:26 PM. <strong>Pick up the Volvo XC60 on-site at JNU<\u002Fstrong> (Turo res #59885242) — you need it for Auke Bay the next two mornings. Check into Four Points by Sheraton. Light dinner downtown.\" },\n    { \"date\": \"2026-08-10\", \"plan\": \"<strong>Whale watching 7:30 AM – 11:30 AM<\u002Fstrong> with Harv & Marv's — meet at Statter Harbor (Auke Bay), 6-passenger boat. Booking #351420672. Afternoon: walk Juneau, Red Dog Saloon, dinner at Tracy's King Crab Shack.\" },\n    { \"date\": \"2026-08-11\", \"plan\": \"<strong>Waterfall Creek bear day<\u002Fstrong> with Above & Beyond Alaska — pickup 1:30 PM at Pavitts Health & Fitness Auke Bay (operator moved this from 7:30 AM), 30-min floatplane to Chichagof Island, 3 hrs with bears, back by ~7:30 PM. Morning is free. Booking #351418378.\" },\n    { \"date\": \"2026-08-12\", \"plan\": \"Morning free in Juneau. <strong>2:45 PM TEMSCO pickup at Four Points lobby<\u002Fstrong> (be ready 2:30 PM) for dog sledding on Mendenhall Glacier — helicopter to dog camp, real sled ride, back to hotel by ~5:45 PM. Conf #351540985. Dinner in town after.\" },\n    { \"date\": \"2026-08-13\", \"plan\": \"<strong>Juneau buffer/relaxation day.<\u002Fstrong> Mt. Roberts tram, downtown wandering, lunch, early dinner. <strong>Return the Volvo at JNU<\u002Fstrong> before departure. <strong>Alaska 1539 JNU → ANC 7:15 PM, arrive 9:01 PM.<\u002Fstrong> Conf #GFXHIT. Anchorage Marriott Downtown check-in ~9:45 PM (Conf #71989845).\" },\n    { \"date\": \"2026-08-14\", \"plan\": \"<strong>Alaska Railroad GoldStar ANC → Denali<\u002Fstrong> — depart 8:20 AM (check-in 7:20 AM), arrive 3:40 PM. Conf #WRR788421. Look for the Denali Bluffs/Grande Denali shuttle at the train depot. Check-in at Denali Bluffs Hotel (conf #HAS87JEDY). <strong>6:45 PM pickup at the Bluffs d, otherwise leave bags with the bell desk. <strong>Return the 4Runner at ANC ~6:00 PM<\u002Fstrong> (South Terminal), then <strong>DL 0416 ANC → ATL departs 8:24 PM<\u002Fstrong> — Delta One overnight, arrive ATL 7:14 AM Aug 20.\" }\n  ],\n  \"budget\": [\n    { \"line\": \"Delta flights (taxes only — open-jaw award)\", \"category\": \"Air\", \"estimate\": 100, \"actual\": 100, \"status\": \"booked\", \"notes\": \"~120K SkyMiles burned. ATL-JNU Comfort+ outbound, ANC-ATL Delta One return.\" },\n    { \"line\": \"JNU → ANC intra-Alaska flight (Alaska Airlines, First Class)\", \"category\": \"Air\", \"estimate\": 400, \"actual\": 546.80, \"status\": \"booked\", \"notes\": \"Alaska 1539, Conf #GFXHIT. $273.40/pax in First Class — reasonable on a 1.5 hr hop.\" },\n    { \"line\": \"Four Points Juneau (5 nights — 4 used, 5th free buffer)\", \"category\": \"Hotel\", \"estimate\": 0, \"actual\": 0, \"status\": \"booked\", \"notes\": \"Conf #70293902. Bonvoy points (5th night free benefit). 5th night = late checkout buffer for Aug 13 evening flight. $0 cash.\" },\n    { \"line\": \"Anchorage Marriott Downtown — Aug 13 (1 night)\", \"category\": \"Hotel\", \"estimate\": 0, \"actual\": 325, \"status\": \"booked\", \"notes\": \"Conf #71989845. Paid 65K Bonvoy points + $325 cash to buy needed points. Out of points after this.\" },\n    { \"line\": \"Hotel Captain Cook — Aug 17-19 (2 nights, Junior Suite)\", \"category\": \"Hotel\", \"estimate\": 600, \"actual\": 1637.46, \"status\": \"booked\", \"notes\": \"Booking #9092917186777 via HotelsOne. Junior Suite. Prepaid, likely non-refundable. Premium splurge to finish the trip — Crow's Nest restaurant on premises.\" },\n    { \"line\": \"Denali Bluffs Hotel (3 nights)\", \"category\": \"Hotel\", \"estimate\": 2272, \"actual\": 2077.65, \"status\": \"booked\", \"notes\": \"Conf #HAS87JEDY. NPR switched from Grande Denali to Denali Bluffs (sister property). Includes $188.88 NPR service fee.\" },\n    { \"line\": \"Denali Bluffs rail transfer + baggage (round trip)\", \"category\": \"Transit\", \"estimate\": 68, \"actual\": 48, \"status\": \"booked\", \"notes\": \"BOOKED BY PHONE Aug 10, 2026 (no written confirmation received). Quoted $12/person + $12/luggage = $48 round trip as calculated. UNVERIFIED: if the $12 is per LEG rather than per round trip, the true figure is nearer $96 — the old $68 estimate decomposed as 2 pax x 2 legs x $12, which suggests per-leg pricing. Confirm at check-in. Shuttle meets the train Aug 14, returns Aug 17.\" },\n    { \"line\": \"Alaska Railroad GoldStar (round trip, 2 pax)\", \"category\": \"Transit\", \"estimate\": 1520, \"actual\": 1598.00, \"status\": \"booked\", \"notes\": \"Conf #WRR788421. Aug 14 northbound + Aug 17 southbound.\" },\n    { \"line\": \"Juneau rental car (Volvo XC60, Aug 9-13, Turo)\", \"category\": \"Transit\", \"estimate\": 350, \"actual\": 921.47, \"status\": \"booked\", \"notes\": \"Turo res #59885242. 2023 Volvo XC60, AWD, unlimited miles, on-site pickup at JNU. $571.47 over estimate — the $675 listing was before taxes; $921.47 is the all-in total. Covers Auke Bay self-transport for the Aug 10 whale tour + Aug 11 bear tour, plus the Aug 13 airport run.\" },\n    { \"line\": \"Waterfall Creek bear tour\", \"category\": \"Activity\", \"estimate\": 2000, \"actual\": 2096.68, \"status\": \"booked\", \"notes\": \"Above & Beyond Alaska, booking #351418378\" },\n    { \"line\": \"Harv's whale tour (6-pax boat)\", \"category\": \"Activity\", \"estimate\": 500, \"actual\": 375.90, \"status\": \"booked\", \"notes\": \"Alaska Galore Tours / Harv & Marv's, booking #351420672. Aug 10: operator switched us to the 18-passenger boat and refunded the $65.10 difference unprompted. Net paid $375.90.\" },\n    { \"line\": \"TEMSCO helicopter + dog sled on Mendenhall Glacier\", \"category\": \"Activity\", \"estimate\": 1400, \"actual\": 1481.88, \"status\": \"booked\", \"notes\": \"Conf #351540985. $82 over estimate, basically on budget.\" },\n    { \"line e fee. After this, 50% refund only.\" },\n    { \"date\": \"2026-08-15\", \"item\": \"Crow's Nest dinner reservation (Tue Aug 18, 8:30 PM)\", \"consequence\": \"STILL NOT BOOKED. Call 907-343-2217 to book the 8:30 PM last seating for Tue Aug 18. CALL BY SATURDAY AUG 15 - the restaurant is closed Sun Aug 16 and Mon Aug 17, so Saturday is the last day you can actually reach it before the booking. Mention you're hotel guests that night arriving back from the Kenai Fjords cruise and ask how they handle a 10-15 min late arrival. (Closed Sun-Mon is also why the Aug 17 return-from-Denali night was never an option.) Fallback if the highway wins: Whale's Tail/Fletcher's downstairs, or walk in at 5:00 PM sharp on Aug 19.\" },\n    { \"date\": \"2026-07-27\", \"item\": \"Harv's whale tour (Aug 10)\", \"consequence\": \"Last day for 50% refund. After this, no refund (except weather/illness).\" },\n    { \"date\": \"2026-07-31\", \"item\": \"Denali Bluffs Hotel (Aug 14-17)\", \"consequence\": \"Last day to cancel without 100% penalty (14 days prior to arrival, by 3:00 PM local). NPR service fee ($188.88) is always non-refundable.\" },\n    { \"date\": \"2026-08-07\", \"item\": \"Four Points Juneau (Aug 9-14)\", \"consequence\": \"Last day to cancel Bonvoy reservation without charge (by 11:59 PM local).\" },\n    { \"date\": \"2026-08-08\", \"item\": \"Waterfall Creek bear tour (Aug 11)\", \"consequence\": \"Last day for refund (72 hrs prior). $100 deposit always non-refundable. After this, fully non-refundable. THEY changed the time to 1:30 PM — if the new slot does not work, say so before this date while you still have leverage. Also note a weather scrub can no longer be made up: 1:30 PM on Aug 12 collides with the 2:45 PM TEMSCO pickup, and on Aug 13 it would return ~7:30 PM, after the 7:15 PM flight to Anchorage.\" },\n    { \"date\": \"2026-08-08\", \"item\": \"Tundra Wilderness Tour (Aug 15)\", \"consequence\": \"Last day for cancellation with $8.75/ticket fee only (7 days 12px;\">\n                <div style=\"font-size: 13.5px; font-weight: 700; text-decoration: {{ r.deco }};\">{{ r.item }}<\u002Fdiv>\n                <div style=\"font-size: 9.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; color: {{ r.statusColor }};\">{{ r.status }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(36,26,46,0.4); margin-top: 4px;\">{{ r.dateStr }}<\u002Fdiv>\n              <div style=\"font-size: 12px; line-height: 1.55; color: rgba(36,26,46,0.65); margin-top: 6px;\">{{ r.consequence }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"padding: 26px 22px 44px;\">\n      <div sc-camel-on-click=\"{{ toggleBudget }}\" style=\"display: flex; align-items: center; justify-content: space-between; padding: 17px 19px; border-radius: 20px; background: #241a2e; color: #fdf6ef; cursor: pointer; min-height: 56px;\" style-hover=\"background: #33253f;\">\n        <div>\n          <div style=\"font-size: 16px; font-weight: 900;\">The money bit<\u002Fdiv>\n          <div style=\"font-size: 12px; opacity: 0.65; margin-top: 4px;\">{{ budgetTeaser }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 16px; opacity: 0.6; transform: {{ budgetCaret }}; transition: transform 0.25s ease;\">›<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showBudget }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 10px; border-radius: 20px; background: #ffffff; box-shadow: 0 2px 10px rgba(36,26,46,0.07); padding: 18px 19px;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n            <sc-for list=\"{{ budgetStats }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"font-size: 9.5px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(36,26,46,0.45);\">{{ b.label }}<\u002Fdiv>\n                <div style=\"font-size: 21px; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; color: {{ b.color }};\">{{ b.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 17px; padding-top: 15px; border-top: 1px dashed rgba(36,26,46,0.15);\">\n            <sc-for list=\"{{ budgetCats }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;\"><span style=\"color: rgba(36,26,46,0.65);\">{{ c.name }}<\u002Fspan><span style=\"font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c.total }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height: 7px; border-radius: 999px; background: #efe4f2; overflow: hidden;\"><div style=\"height: 100%; border-radius: 999px; background: #5b3e8e; width: {{ c.pct }};\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 15px; font-size: 11.5px; line-height: 1.6; color: rgba(36,26,46,0.55);\">{{ budgetNote }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;420&quot;,&quot;height&quot;:&quot;900&quot;}}\">\nconst PACK_KEY = 'ak2026-packing-v1';\n\nconst PLACE = {\n  '2026-08-09': 'Juneau', '2026-08-10': 'Juneau', '2026-08-11': 'Juneau', '2026-08-12': 'Juneau',\n  '2026-08-13': 'Anchorage', '2026-08-14': 'Denali', '2026-08-15': 'Denali', '2026-08-16': 'Denali',\n  '2026-08-17': 'Anchorage', '2026-08-18': 'Seward', '2026-08-19': 'Anchorage'\n};\nconst PLACE_COLORS = { Juneau: '#5b3e8e', Denali: '#b5651d', Anchorage: '#3c5a9a', Seward: '#a8336a' };\nconst PLACE_COORDS = {\n  Juneau: [58.3019, -134.4197],\n  Denali: [63.8558, -148.9633],\n  Anchorage: [61.2181, -149.9003],\n  Seward: [60.1042, -149.4422]\n};\n\n// Departure is DL 0481 out of ATL at 1:45 PM Eastern on Aug 9, 2026 (EDT = UTC-4).\nconst DEPART_MS = Date.parse('2026-08-09T13:45:00-04:00');\n\n// NOAA sunrise equation. Returns {rise, set} in ms, or null for midnight sun / polar night.\nfunction sunTimes(dateMs, lat, lon) {\n  const rad = Math.PI / 180;\n  const jdate = dateMs / 86400000 + 2440587.5;\n  const n = Math.round(jdate - 2451545.0 + 0.0008);\n  const jStar = n - lon / 360;\n  const M = (357.5291 + 0.98560028 * jStar) % 360;\n  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);\n  const lambda = (M + C + 180 + 102.9372) % 360;\n  const jTransit = 2451545.0 + jStar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lambda * rad);\n  const decl = Math.asin(Math.sin(lambda * rad) * Math.sin(23.4397 * rad));\n  const cosOmega = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) /\n    (Math.cos(lat * rad) * Math.cos(decl));\n  if (cosOmega > 1 || cosOmega < -1) return null;\n  const omega = Math.acos(cosOmega) / rad;\n  const toMs = j => (j - 2440587.5) * 86400000;\n  return { rise: toMs(jTransit - omega / 360), set: toMs(jTransit + omega / 360) };\n}\n\n// [collection, index] per day — derived from the itinerary text, not guessed at render time.\nconst DAY_BOOKINGS = {\n  '2026-08-09': [['flights', 0], ['hotels', 0], ['activities', 0]],\n  '2026-08-10': [['activities', 2]],\n  '2026-08-11': [['activities', 3]],\n  '2026-08-12': [['activities', 4]],\n  '2026-08-13': [['flights', 1], ['hotels', 1]],\n  '2026-08-14': [['activities', 5], ['hotels', 2], ['activities', 6]],\n  '2026-08-15': [['activities', 7]],\n  '2026-08-16': [['activities', 9]],\n  '2026-08-17': [['activities', 10], ['hotels', 3], ['activities', 1]],\n  '2026-08-18': [['activities', 8]],\n  '2026-08-19': [['flights', 2]]\n};\n\nconst DAY_META = {\n  '2026-08-09': 'Wheels up, Alaska by dinner',\n  '2026-08-10': 'Whales at 7:30 AM',\n  '2026-08-11': 'Bears by floatplane',\n  '2026-08-12': 'Sled dogs on a glacier',\n  '2026-08-13': 'Slow Juneau, then north',\n  '2026-08-14': 'Glass-domed train to Denali',\n  '2026-08-15': 'Into the park, Mile 43',\n  '2026-08-16': 'Land on Ruth Glacier',\n  '2026-08-17': 'Train south, suite in Anchorage',\n  '2026-08-18': 'Fjords, glaciers, Crow\\u2019s Nest',\n  '2026-08-19': 'One last Anchorage day'\n};\n\n// Grounded in the BRING / WEAR / SAVE lines of the booking notes.\nconst PACK_ITEMS = [\n  'Polyester/synthetic layers + rain jacket',\n  'Warm hat & gloves, thick socks',\n  'Sunglasses',\n  'Close-toed walking shoes (glacier boots provided)',\n  'Camera + binoculars',\n  'Photo ID — gov-issued, required for the train',\n  'Cash for guide gratuity',\n  'Business casual for Crow\\u2019s Nest, Aug 18',\n  'Save the Tundra tour receipt = 7-day Denali park pass',\n  'Turo host names, phones and pickup notes saved offline',\n  'No bags/purses on the helicopter or floatplane'\n];\n\nclass Component extends DCLogic {\n  state = { trip: null, open: {}, showBudget: false, showReminders: false, checked: {}, now: Date.now() };\n\n  componentDidMount() {\n    const el = document.getElementById('trip-data');\n    Promise.resolve({ trip: JSON.parse(el.textContent) }).then(m => {\n      this.setState({ trip: m.trip });\n      // Open today's card on load so the day-of view needs no taps.\n      const iso = new Date().toISOString().slice(0, 10);\n      if (m.trip.itinerary.some(d => d.date === iso)) {\n        this.setState(s => { const o = Object.assign({}, s.open); o[iso] = true; return { open: o }; });\n      }\n    }).catch(e => console.error(e));\n    try {\n      const raw = localStorage.getItem(PACK_KEY);\n      if (raw) this.setState({ checked: JSON.parse(raw) });\n    } catch (e) {}\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  money(n) {\n    return n == null ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });\n  }\n\n  segs(html) {\n    const out = [];\n    const re = /<strong>([\\s\\S]*?)<\\/strong>/g;\n    let last = 0, m;\n    while ((m = re.exec(html))) {\n      if (m.index > last) out.push({ text: html.slice(last, m.index), plain: true, bold: false });\n      out.push({ text: m[1], bold: true, plain: false });\n      last = m.index + m[0].length;\n    }\n    if (last < html.length) out.push({ text: html.slice(last), plain: true, bold: false });\n    return out;\n  }\n\n  booking(item, kind) {\n    const isUrl = v => typeof v === 'string' && /^https?:\\/\\//.test(v);\n    const entries = Object.entries(item.fields || {});\n    const links = entries.filter(([, v]) => isUrl(v)).map(([k, v]) => ({ k, url: v }));\n    const labels = { todo: 'To book', pending: 'Pending', booked: 'Booked', confirmed: 'Confirmed', cancelled: 'Cancelled', complete: 'Complete' };\n    return {\n      kind,\n      pill: labels[item.status] || 'To book',\n      name: item.name,\n      subtitle: item.subtitle || '',\n      priority: item.priority || '',\n      fields: entries.filter(([, v]) => !isUrl(v)).map(([k, v]) => ({ k, v: v || '—' })),\n      links, hasLinks: links.length > 0,\n      notes: item.notes || ''\n    };\n  }\n\n  renderVals() {\n    const t = this.state.trip;\n    const left = Math.max(0, DEPART_MS - this.state.now);\n    const countdown = [\n      { n: Math.floor(left / 86400000), label: 'days' },\n      { n: Math.floor((left % 86400000) / 3600000), label: 'hours' },\n      { n: Math.floor((left % 3600000) / 60000), label: 'min' }\n    ];\n\n    const nowDate = new Date(this.state.now);\n    const clockFmt = tz => nowDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz });\n    const clocks = [\n      { zone: 'Home', time: clockFmt('America/New_York'), color: '#fdf6ef' },\n      { zone: 'Alaska', time: clockFmt('America/Anchorage'), color: '#ffcf7a' }\n    ];\n\n    // Sunrise/sunset for wherever they are that day (before the trip, the first stop).\n    const todayKey = new Date().toISOString().slice(0, 10);\n    const sunPlaceName = PLACE[todayKey] || 'Juneau';\n    const coords = PLACE_COORDS[sunPlaceName];\n    const sun = sunTimes(this.state.now, coords[0], coords[1]);\n    const sunFmt = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Anchorage' });\n    const sunLine = sun ? '↑ ' + sunFmt(sun.rise) + '   ↓ ' + sunFmt(sun.set) : 'Sun up all day';\n    const sunPlace = sunPlaceName + ' sunrise / sunset';\n\n    const packing = PACK_ITEMS.map((label, i) => {\n      const on = !!this.state.checked[i];\n      return {\n        label, mark: on ? '✓' : '',\n        deco: on ? 'line-through' : 'none',\n        bg: on ? '#5b3e8e' : 'transparent',\n        border: on ? '#5b3e8e' : 'rgba(36,26,46,0.28)',\n        text: on ? 'rgba(36,26,46,0.4)' : '#241a2e',\n        toggle: () => this.setState(s => {\n          const next = Object.assign({}, s.checked);\n          next[i] = !next[i];\n          try { localStorage.setItem(PACK_KEY, JSON.stringify(next)); } catch (e) {}\n          return { checked: next };\n        })\n      };\n    });\n\n    const base = {\n      countdown, packing, clocks, sunLine, sunPlace,\n      showBudget: this.state.showBudget,\n      budgetCaret: this.state.showBudget ? 'rotate(90deg)' : 'rotate(0deg)',\n      toggleBudget: () => this.setState(s => ({ showBudget: !s.showBudget })),\n      showReminders: this.state.showReminders,\n      remindersCaret: this.state.showReminders ? 'rotate(90deg)' : 'rotate(0deg)',\n      toggleReminders: () => this.setState(s => ({ showReminders: !s.showReminders })),\n      days: [], reminders: [], budgetStats: [], budgetCats: [],\n      budgetTeaser: '', budgetNote: '', remindersTeaser: ''\n    };\n    if (!t) return base;\n\n    const todayISO = new Date().toISOString().slice(0, 10);\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n\n    const days = t.itinerary.map(d => {\n      const [y, m, dnum] = d.date.split('-').map(Number);\n      const dt = new Date(Date.UTC(y, m - 1, dnum));\n      const bookings = (DAY_BOOKINGS[d.date] || []).map(([coll, idx]) =>\n        this.booking(t[coll][idx], coll === 'flights' ? 'FLIGHT' : coll === 'hotels' ? 'STAY' : 'DO'));\n      const isToday = d.date === todayISO;\n      const open = !!this.state.open[d.date];\n      const region = PLACE[d.date] || 'Juneau';\n      return {\n        dayNum: String(dnum),\n        dow: dt.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }),\n        head: DAY_META[d.date] || '',\n        region, color: PLACE_COLORS[region],\n        ring: isToday ? PLACE_COLORS[region] : 'transparent',\n        countLabel: bookings.length === 1 ? '1 booking' : bookings.length + ' bookings',\n        segs: this.segs(d.plan),\n        bookings, open,\n        caret: open ? 'rotate(90deg)' : 'rotate(0deg)',\n        toggle: () => this.setState(s => {\n          const next = Object.assign({}, s.open);\n          next[d.date] = !next[d.date];\n          return { open: next };\n        })\n      };\n    });\n\n    const sortedD = t.deadlines.slice().sort((a, b) => a.date.localeCompare(b.date));\n    let upcoming = 0;\n    const reminders = sortedD.map(d => {\n      const [y, m, day] = d.date.split('-').map(Number);\n      const dt = new Date(Date.UTC(y, m - 1, day));\n      const out = Math.ceil((dt.getTime() - today.getTime()) / 86400000);\n      let status, statusColor;\n      if (out < 0) { status = 'Passed'; statusColor = 'rgba(36,26,46,0.35)'; }\n      else if (out === 0) { status = 'Today'; statusColor = '#a8336a'; upcoming++; }\n      else if (out <= 7) { status = out + (out === 1 ? ' day left' : ' days left'); statusColor = '#a8336a'; upcoming++; }\n      else { status = out + ' days left'; statusColor = '#b5651d'; upcoming++; }\n      return {\n        item: d.item, consequence: d.consequence, status, statusColor,\n        dateStr: dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }),\n        opacity: out < 0 ? '0.5' : '1',\n        deco: out < 0 ? 'line-through' : 'none'\n      };\n    });\n\n    let bookedActual = 0, unbooked = 0;\n    t.budget.forEach(i => {\n      if (i.status === 'booked' && i.actual != null) bookedActual += i.actual;\n      else unbooked += i.estimate;\n    });\n    const projected = bookedActual + unbooked;\n    const headroom = t.budgetCeiling - projected;\n\n    const sums = ['Air', 'Hotel', 'Transit', 'Activity', 'Food', 'Other'].map(name => ({\n      name,\n      raw: t.budget.filter(i => i.category === name)\n        .reduce((s, i) => s + (i.actual != null ? i.actual : i.estimate), 0)\n    })).filter(c => c.raw > 0);\n    const maxCat = Math.max.apply(null, sums.map(c => c.raw));\n\n    return Object.assign(base, {\n      days, reminders,\n      remindersTeaser: upcoming + ' still ahead · tap to open',\n      budgetStats: [\n        { label: 'Paid so far', value: this.money(bookedActual), color: '#5b3e8e' },\n        { label: 'Still to spend', value: this.money(unbooked), color: '#b5651d' },\n        { label: 'Projected total', value: this.money(projected), color: '#241a2e' },\n        { label: 'Vs $' + t.budgetCeiling.toLocaleString() + ' plan', value: this.money(headroom), color: '#a8336a' }\n      ],\n      budgetCats: sums.map(c => ({ name: c.name, total: this.money(c.raw), pct: Math.round((c.raw / maxCat) * 100) + '%' })),\n      budgetTeaser: this.money(projected) + ' projected · tap for the breakdown',\n      budgetNote: t.budgetNote\n    });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
